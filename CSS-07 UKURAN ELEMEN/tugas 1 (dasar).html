<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas Satuan ukuran CSS</title>
    <style>
        h1 {
            font-size: 32px;
            color: darkblue;
        }
        p {
            font-size: 14pt;
        }
        .box-cm {
            width: 10cm;
            height: 5cm;
            background-color: lightgreen;
            margin-bottom: 20px;
        }
        .box-persen {
            width: 50%;
            height: 100px;
            background-color: lightcoral;
        }
    </style>
</head>
<body>

    <h1>HALO INI HASIL TUGAS AKU GUWAH</h1>

    <p>
        Ini adalah paragraf yang menggunakan satuan pt (point).
    </p>

    <div class="box-cm">
        Box dengan ukuran cm
    </div>

    <div class="box-persen">
        Box dengan ukuran %
    </div>

</body>
</html>
