<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box justify-content</title>
    <style>
        body {
            text-align: center;
        background-image: url(Real\ Madrid\ beat\ Manchester\ City\ 5-1\ on\ aggregate\ 🤣..jpg);
        background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            background-size: contain;
    }

        .container{
            
            margin-top: 30px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
           gap: 30px;
        }
        img{
            width: 250px;
            height: auto;
            border-radius:10px;
        }
        h1{
            font-family: sans-serif;
            text-align: center;
            text-decoration: solid;
            color: aliceblue;
        }
    </style>
</head>
<body>
    <h1>Galery Foto</h1>
    <div class="container">
        <img src="boleh gadang.jpg" alt="">
        <img src="king madrid1.jpeg" alt="">
        <img src="download.jpeg" alt="">
        <img src="aku madrid on TikTok.jpeg" alt="">
    </div>
</body>
</html>
