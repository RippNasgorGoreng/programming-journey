<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.gallery{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            
            

        }
        div.gallery-item{
            margin: 5px;
            border: 1px solid #ccc;
            width: 180px;
        }
        div.gallery-item:hover{
            border: 1px solid #777;
            background-color: aliceblue;
        }
        div.gallery-item img{
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        div.gallery-item div.desc{
            padding: 15px;
            text-align: center;
            background-color: white;
        }
        h2{
            color: white;
            text-align: center;
        }
    </style>
</head>
<body>
    <body style="background-color: maroon;">
    <h2>Image Gallery</h2>

    <div class="gallery">

        <div class="gallery-item">
            <a target="_blank" href="Aku madrid.jpeg">
                <img src="Aku madrid.jpeg" alt="my favorite Football Club" width="600" height="400">
            </a>
            <div class="desc">My Favorite Football Club</div>
        </div>

        <div class="gallery-item">
            <a target="_blank" href="persi berbaju_v.jpeg">
                <img src="persi berbaju_v.jpeg" alt=" My type school" width="600" height="400">
            </a>
            <div class="desc">My school type <strong></strong></div>
        </div>

        <div class="gallery-item">
            <a target="_blank" href="download.jpeg">
                <img src="download.jpeg" alt="My Friend" width="600" height="400">
            </a>
            <div class="desc">My Friend</div>
        </div>

        <div class="gallery-item">
            <a target="_blank" href="Mie Ayam🤤🤤.jpeg">
                <img src="Mie Ayam🤤🤤.jpeg" alt="Mie ayam" width="600" height="400">
            </a>

        </div>

    </div>
</body>
</html>
