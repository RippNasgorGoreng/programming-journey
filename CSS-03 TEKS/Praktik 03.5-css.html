<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale-1.0">
<title>Text Shadow</title>
<style>
h1 {
color: lime;
text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
}
h2 {
    color: silver;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
}
</style>

</head>
<body>
<h1>Persebaya Surabaya</h1>
<h2>Klub Sepakbola kebanggan yang berasal dari Surabaya. Pada saat ini bermain di kasta tertinggi liga indonesia</h2>
</body>
</html>
