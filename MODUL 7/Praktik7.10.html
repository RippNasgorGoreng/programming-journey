<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element button</title>
</head>
<body>
    <form>
        <fieldset>
            <legend> Informasi Pribadi</legend>
            <label for="nama"> Nama: </label>
            <input for="text" id="nama" name="nama"><br><br>
        </fieldset>
        <br>
        <fieldset>
            <legend> Informasi Pekerjaan </legend>
            <label for="Pekerjaan"> Pekerjaan: </label>
            <input for="text" id="Pekerjaan" name="Pekerjaan"><br><br>
            <label for="Perusahaan"> Perusahaan: </label>
            <input for="text" id="Perusahaan" name="Perusahaan"><br><br>
            

        </fieldset>
        <br>
        <input type="submit" value="Kirim">
      
    </form>
</body>
</html>
