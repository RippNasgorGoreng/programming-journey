<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduTask</title>
     <script>
        if (localStorage.getItem('edutask_theme') === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-bubble"></div>
    <div class="login-bubble"></div>
    <div class="login-bubble"></div>

    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-graduation-cap"></i>
            </div>
            <h1>EduTask</h1>
            <p>Platform Manajemen Tugas Siswa</p>
        </div>

        <!-- Tab Login & Daftar -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login')">Masuk</button>
            <button class="auth-tab" onclick="switchTab('register')">Daftar</button>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="loginUser">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="loginUser" placeholder="Masukkan username" required autocomplete="off">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="loginPass">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPass" placeholder="Masukkan password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
        </form>

        <!-- Form Daftar -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="regUser">Username Baru</label>
                <div class="input-wrapper">
                    <input type="text" id="regUser" placeholder="Buat username" required autocomplete="off">
                    <i class="fas fa-user-plus"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="regPass">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regPass" placeholder="Buat password" required>
                    <i class="fas fa-lock"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="regPass2">Konfirmasi Password</label>
                <div class="input-wrapper">
                    <input type="password" id="regPass2" placeholder="Ulangi password" required>
                    <i class="fas fa-shield-halved"></i>
                </div>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-user-check"></i> Daftar Sekarang
            </button>
        </form>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="script.js"></script>
    <script>
        // Cek jika sudah login, langsung redirect
        if (localStorage.getItem('edutask_loggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }

        // Fungsi ganti tab Login/Daftar
        function switchTab(type) {
            document.querySelectorAll('.auth-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));

            if (type === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }
    </script>
</body>
</html>
