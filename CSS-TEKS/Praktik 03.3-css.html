<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Decoration</title>
    <style> 
        h1{
            text-transform: capitalize;
        }
        .upper{
            text-transform: uppercase;
        }
        .lower{
            text-transform: lowercase;
        }
    </style>
</head>
<body>
    <h1>Kata Kata Hari ini</h1>
    <p>
       <span class="upper">semangat belajar hari ini</span> adalah langkah kecil menuju masa depan yang lebih cerah. 
       <span class="lower">JANGAN PERNAH MERASA TAKUT UNTUK MENCOBA HAL BARU, KARENA SETIAP PENGALAMAN AKAN MEMBERIKAN PELAJARAN BERHARGA DALAM HIDUP.</span>
    </p>
</body>
</html>
